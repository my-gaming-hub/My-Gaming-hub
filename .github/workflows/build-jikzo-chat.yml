name: Build JIKZO Chat APK

on:
  push:
    branches: [jikzo-chat-app]
    paths:
      - 'apps/jikzo-chat/**'
      - '.github/workflows/build-jikzo-chat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jikzo-chat
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle_file = next((p for p in candidates if p.exists()), None)
          if gradle_file is None:
              raise SystemExit("Could not find generated Android app Gradle file")
          source = gradle_file.read_text()
          replacements = [
              ("compileSdk = flutter.compileSdkVersion", "compileSdk = 36"),
              ("compileSdk flutter.compileSdkVersion", "compileSdk 36"),
              ("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36"),
          ]
          for old, new in replacements:
              if old in source:
                  source = source.replace(old, new, 1)
                  gradle_file.write_text(source)
                  print(f"Set compile SDK 36 in {gradle_file}")
                  break
          else:
              if "compileSdk = 36" not in source and "compileSdk 36" not in source and "compileSdkVersion 36" not in source:
                  raise SystemExit(f"Could not identify compileSdk setting in {gradle_file}")
          PY

      - name: Disable broken release lint analysis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle_file = next((p for p in candidates if p.exists()), None)
          if gradle_file is None:
              raise SystemExit("Could not find generated Android app Gradle file")
          source = gradle_file.read_text()
          if "checkReleaseBuilds" not in source:
              if gradle_file.suffix == ".kts":
                  lint_config = "    lint {\n        checkReleaseBuilds = false\n    }\n"
              else:
                  lint_config = "    lint {\n        checkReleaseBuilds false\n    }\n"
              source = source.replace("android {", "android {\n" + lint_config, 1)
              gradle_file.write_text(source)
          print(f"Configured release lint in {gradle_file}")
          PY

      - name: Add Android internet permission
        run: sed -i '/<application/i\\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jikzo-chat-android-apk
          path: apps/jikzo-chat/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
