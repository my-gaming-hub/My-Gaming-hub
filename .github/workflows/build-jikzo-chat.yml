name: Build JIKZO Chat APK

on:
  push:
    branches: [jikzo-chat-app]
    paths:
      - 'apps/jikzo-chat/**'
      - '.github/workflows/build-jikzo-chat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jikzo-chat
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jikzo-chat-android-apk
          path: apps/jikzo-chat/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
